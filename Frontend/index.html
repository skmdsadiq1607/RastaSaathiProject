<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><path d=%22M50 85c-20-15-40-30-40-50 0-10 8-18 18-18 7 0 13 4 17 10 4-6 10-10 17-10 10 0 18 8 18 18 0 20-20 35-40 50z%22 fill=%22%23ef4444%22/><path d=%22M20 40h15l5-10 10 25 5-15h15%22 fill=%22none%22 stroke=%22white%22 stroke-width=%224%22 stroke-linecap=%22round%22/></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RastaSaathi!</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Aggressive script to remove Google Maps billing overlays -->
    <script>
      const observer = new MutationObserver((mutations) => {
        const dismissButton = document.querySelector('.dismissButton');
        if (dismissButton) {
          const container = dismissButton.closest('.gm-style') || dismissButton.parentElement.parentElement;
          if (container && container.parentElement) {
            // Find the overlay wrapping the map and hide it
            dismissButton.click(); // try clicking it first
            
            // Aggressively hide any modal-like wrappers
            const modals = document.querySelectorAll('.gm-err-container, .gm-err-message');
            modals.forEach(m => m.style.setProperty('display', 'none', 'important'));
            
            // Also hide the watermark text "For development purposes only"
            const watermarks = document.querySelectorAll('div[style*="z-index: 100"]');
            watermarks.forEach(w => {
              if (w.innerText.includes('development purposes') || w.innerText.includes('Google')) {
                w.style.setProperty('display', 'none', 'important');
              }
            });
          }
        }
        
        // Also catch gm-err-container directly if it appears without dismiss button
        const errContainer = document.querySelector('.gm-err-container');
        if (errContainer) errContainer.style.setProperty('display', 'none', 'important');
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
